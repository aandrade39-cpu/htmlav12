<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de evaluación de calificaciones</title>
    <style>
        /* Estilos base (puedes moverlos a tu archivo CSS general si lo prefieres) */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .contenedor {
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .campo {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #004494;
        }
        #resultado {
            margin-top: 25px;
            padding: 15px;
            border-radius: 5px;
            background-color: #eef2f7;
            border-left: 5px solid #0056b3;
            display: none; /* Oculto hasta que se realice el cálculo */
        }
        .aprobado {
            color: #155724;
            font-weight: bold;
        }
        .reprobado {
            color: #721c24;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Sistema de evaluación de calificaciones</h1>

        <form id="formCalificaciones">
            <div class="campo">
                <label for="nombre">Nombre del estudiante:</label>
                <input type="text" id="nombre" placeholder="Ej. Ana López">
            </div>

            <div class="campo">
                <label for="cal1">Primera calificación (0 - 10):</label>
                <input type="number" id="cal1" step="0.1" min="0" max="10" placeholder="0.0">
            </div>

            <div class="campo">
                <label for="cal2">Segunda calificación (0 - 10):</label>
                <input type="number" id="cal2" step="0.1" min="0" max="10" placeholder="0.0">
            </div>

            <div class="campo">
                <label for="cal3">Tercera calificación (0 - 10):</label>
                <input type="number" id="cal3" step="0.1" min="0" max="10" placeholder="0.0">
            </div>

            <button type="button" id="btnCalcular">Calcular promedio</button>
        </form>

        <!-- Espacio para mostrar los resultados -->
        <div id="resultado"></div>
    </div>

    <!-- Vinculación del archivo JavaScript externo -->
    <script src="calificaciones.js"></script>
</body>
</html>
